name: Flutter Web deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Enable web
        run: flutter config --enable-web

      - name: Get dependencies
        working-directory: lumiere-app/mi_app
        run: flutter pub get

      - name: Build Flutter web
        working-directory: lumiere-app/mi_app
        run: flutter build web --release --base-href '/'

      - name: Publish web build to docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a lumiere-app/mi_app/build/web/. docs/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet -- docs; then
            git commit -m "Deploy Flutter web to docs"
            git push origin HEAD:main
          else
            echo "No changes in docs directory"
          fi
